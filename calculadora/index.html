<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora financeira — Simone Reis</title>
<meta name="description" content="Calculadora financeira RPN (réplica HP-12C): TVM, fluxos de caixa, amortização, datas e relatório em PDF/CSV.">
<link rel="canonical" href="https://simone.rreis.app/calculadora/">
<style>
:root{--bg:#091b1e;--card:#133134;--line:#1f4448;--acc:#a7cd3e;--txt:#f7f8f7;--mut:#8fa8ac}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;display:flex;flex-direction:column}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
header.top{flex:0 0 auto;border-bottom:1px solid var(--line);background:rgba(9,27,30,.95)}
header.top .wrap{max-width:1280px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.brand b{color:var(--acc)}
.note{font-size:12px;color:var(--mut)}
.frame{flex:1 1 auto;min-height:0;width:100%;max-width:1280px;margin:0 auto;padding:12px 12px 16px}
iframe{width:100%;height:100%;border:1px solid var(--line);border-radius:14px;background:#0d2427;display:block}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><a href="../">← Análises</a> &nbsp;·&nbsp; <b>Calculadora financeira</b></div>
    <div class="note">réplica RPN · TVM, fluxos, amortização e datas · <b>Simone Reis</b></div>
  </div>
</header>
<div class="frame">
  <iframe src="app.html" title="Calculadora financeira Simone Reis"></iframe>
</div>
</body>
</html>
